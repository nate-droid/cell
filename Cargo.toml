[workspace]
resolver = "3"
members = [
    "crates/cell",
    "crates/cell-compose",
    "crates/capability-log",
    "crates/capability-fs",
    "crates/capability-openai",
    "crates/guest",
    "examples/hello",
    "examples/hello-host",
    "examples/fs-demo",
    "examples/formatter-provider",
    "examples/formatter-app",
    "examples/compose-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
wasmtime = { version = "47.0.3", features = ["component-model"] }
wit-bindgen = "0.48"
